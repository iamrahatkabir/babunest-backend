# Provides only the database. The Payload app itself runs on the host
# via `npm run dev`, so it stays fast to reload.
#
#   docker compose up -d
#
# Matches the default DATABASE_URL in .env:
#   postgres://postgres:postgres@localhost:5432/brownmoor_dev

services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brownmoor_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d brownmoor_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
